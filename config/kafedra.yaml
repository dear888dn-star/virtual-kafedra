# Kafedra sozlamalari. Rollar, o'qituvchilar soni va chegaralar shu yerda.
kafedra:
  name: Iqtisodiyot va turizm kafedrasi
  audience: Universitet bakalavr kursi
  languages: [ uz, ru, en ]
  default_language: uz

limits:
  max_revisions: 2 # uslubchi qaytargan ishni necha marta qayta ishlash mumkin
  concurrency: 3 # bir vaqtda ishlaydigan o'qituvchilar soni
  max_input_chars: 20000 # topshiriq matnining maksimal hajmi
  max_material_chars: 30000 # manba materialning maksimal hajmi
  max_plan_tasks: 8 # mudir bitta topshiriqni ko'pi bilan nechta vazifaga bo'la oladi
  max_requests_per_run: 60 # bitta topshiriq uchun model so'rovlarining qat'iy chegarasi (tokenlarni himoya qiladi)

# Agentlar. O'qituvchi qo'shish uchun yangi qator yozing (role: oqituvchi).
agents:
  - id: mudir
    name: Prof. Marina Petrovna
    role: mudir
    title: Kafedra mudiri
    prompt: mudir.md
    color: "#7a3b3b"
  - id: uslubchi
    name: Dostonboy
    role: uslubchi
    title: Uslubchi
    prompt: uslubchi.md
    color: "#8a2d6b"
  - id: t1
    name: Dilshod
    role: oqituvchi
    title: Ma'ruzachi
    deliverable_type: lecture
    skills: [lecture, essay, report, lesson_plan, syllabus]
    prompt: ma-ruzachi.md
    color: "#2f6f8f"
  - id: t2
    name: Sarvar
    role: oqituvchi
    title: Testchi
    deliverable_type: test
    skills: [test, exam]
    prompt: testchi.md
    color: "#3f7d4e"
  - id: t3
    name: Sardor
    role: oqituvchi
    title: Amaliyotchi
    deliverable_type: practice
    skills: [practice, case]
    prompt: amaliyotchi.md
    color: "#b5702a"
  - id: t4
    name: Mubina
    role: oqituvchi
    title: Slaydchi
    deliverable_type: slides
    skills: [slides]
    prompt: slaydchi.md
    color: "#6a4fb0"
  - id: t5
    name: Arslon
    role: oqituvchi
    title: Lingvist
    deliverable_type: glossary
    skills: [glossary]
    prompt: lingvist.md
    color: "#a3453f"
